  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #8a8a8a;
      --rule: #c8c8c8;
      --folder: #c4a35a;
      --folder-open: #d4b86a;
      --folder-flap: #f5f0e6;
      --focus: #0066cc;
      --link: #000000;
      --font: "Courier New", Courier, monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    a:hover { opacity: 0.65; }
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .page {
      max-width: 26rem;
      margin: 0 auto;
      padding: 1.75rem 1.35rem 2.75rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* —— Tree —— */
    .tree {
      list-style: none;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .tree > ul {
      width: 100%;
      max-width: 22rem;
    }

    .tree ul {
      list-style: none;
      margin: 0;
      padding: 0 0 0 1.35rem;
    }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      padding: 0.18rem 0.2rem;
      min-height: 1.5rem;
    }

    .folder-btn {
      appearance: none;
      border: 0;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      padding: 0.18rem 0.2rem;
      text-align: left;
      width: 100%;
      line-height: 1.45;
      border-radius: 2px;
    }
    .folder-btn:hover { background: rgba(0, 0, 0, 0.03); }

    .folder-btn[aria-expanded="true"] .icon-folder .flap {
      fill: var(--folder-flap);
    }
    .folder-btn[aria-expanded="true"] .icon-folder path.flap-body {
      fill: #e8d9a8;
    }

    .label {
      word-break: break-word;
    }

    .folder-label::after {
      content: " /";
      color: var(--text);
    }

    /* Icons — lo-fi system look */
    .icon {
      flex-shrink: 0;
      width: 16px;
      height: 14px;
      margin-top: 0.2rem;
      display: block;
    }

    .icon-folder {
      width: 16px;
      height: 13px;
    }

    .icon-doc {
      width: 13px;
      height: 15px;
    }

    .file-block {
      padding: 0.1rem 0 0.35rem;
    }

    .file-line {
      display: flex;
      align-items: flex-start;
      gap: 0.45rem;
      padding: 0.12rem 0.2rem;
      color: var(--text);
    }

    .file-line .meta {
      display: block;
    }

    .listen {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.15rem 0;
      padding: 0.12rem 0.2rem 0.12rem calc(13px + 0.45rem + 0.2rem);
      font-size: 0.92em;
    }

    .listen-label {
      margin-right: 0.35rem;
      color: var(--text);
    }

    .listen a {
      white-space: nowrap;
    }

    .sep {
      color: var(--muted);
      margin: 0 0.35rem;
      user-select: none;
    }

    .socials {
      margin: 0.85rem 0 0;
      padding: 0.35rem 0.2rem;
      font-size: 0.88em;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.85rem 1rem;
      width: 100%;
    }

    .socials a.about-link {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .socials a.about-link:hover {
      color: var(--text);
      opacity: 1;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.35rem;
      height: 1.35rem;
      color: var(--muted);
      line-height: 0;
      text-decoration: none;
    }
    .social-icon:hover {
      color: var(--text);
      opacity: 1;
    }
    .social-icon svg {
      width: 18px;
      height: 18px;
      display: block;
      overflow: visible;
    }

    /* —— Footer —— */
    footer {
      margin-top: 2.5rem;
      padding-top: 0;
    }

    .footer-rule {
      border: 0;
      border-top: 1px solid var(--rule);
      margin: 0 0 0.55rem;
    }

    .footer-url {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--font);
    }

    .footer-url a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer-url a:hover {
      color: var(--text);
      text-decoration: underline;
      opacity: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body { font-size: 14px; }
      .page {
        max-width: 100%;
        padding: 1.35rem 1.4rem 2.25rem;
      }
      .tree > ul { max-width: 100%; }
      .tree ul { padding-left: 1.1rem; }
      .listen { padding-left: calc(13px + 0.45rem); }
      .socials {
        margin-left: 0;
        width: 100%;
        gap: 0.75rem 0.9rem;
        justify-content: center;
      }
    }
  </style>
</head>

        if (r.youtube) platforms.push(`<a href="${r.youtube}" target="_blank" rel="noopener noreferrer">YouTube</a>`);
        html = `<span class="listen-label"><a href="${r.smart}" target="_blank" rel="noopener noreferrer">Listen</a>:</span> `;
        html += platforms.join(`<span class="sep" aria-hidden="true"> · </span>`);
      } else {
        html = `<span class="listen-label">Listen:</span> `;
        const platforms = [];
        if (r.apple) platforms.push(`<a href="${r.apple}" target="_blank" rel="noopener noreferrer">Apple Music</a>`);
        if (r.spotify) platforms.push(`<a href="${r.spotify}" target="_blank" rel="noopener noreferrer">Spotify</a>`);
        if (r.youtube) platforms.push(`<a href="${r.youtube}" target="_blank" rel="noopener noreferrer">YouTube</a>`);
        html += platforms.join(`<span class="sep" aria-hidden="true"> · </span>`);
      }
      return `<div class="listen">${html}</div>`;
    }

    function groupByYear(releases) {
      const map = new Map();
      for (const r of releases) {
        if (!map.has(r.year)) map.set(r.year, []);
        map.get(r.year).push(r);
      }
      return [...map.entries()].sort((a, b) => b[0] - a[0]);
    }

    function uid() {
      return "f-" + Math.random().toString(36).slice(2, 9);
    }

    function buildRelease(li, r, open) {
      const id = uid();
      const panelId = id + "-panel";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "folder-btn";
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      btn.setAttribute("aria-controls", panelId);
      btn.id = id;
      btn.innerHTML = `${folderIcon()}<span class="label folder-label">${escapeHtml(r.title)}</span>`;

      const panel = document.createElement("ul");
      panel.id = panelId;
      panel.hidden = !open;
      panel.setAttribute("role", "group");
      panel.setAttribute("aria-labelledby", id);

      const typeLi = document.createElement("li");
      typeLi.innerHTML = `<div class="file-line">${docIcon()}<span class="meta">${typeLabel(r.type)}</span></div>`;
      panel.appendChild(typeLi);

      const listenHtml = listenLine(r);
      if (listenHtml) {
        const listenLi = document.createElement("li");
        listenLi.innerHTML = listenHtml;
        panel.appendChild(listenLi);
      }

      btn.addEventListener("click", () => toggle(btn, panel));

      li.appendChild(btn);
      li.appendChild(panel);
    }

    function toggle(btn, panel) {
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function makeFolder(label, open) {
      const id = uid();
      const panelId = id + "-panel";
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "folder-btn";
      btn.id = id;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      btn.setAttribute("aria-controls", panelId);
      btn.innerHTML = `${folderIcon()}<span class="label folder-label">${escapeHtml(label)}</span>`;
      const ul = document.createElement("ul");
      ul.id = panelId;
      ul.hidden = !open;
      ul.setAttribute("role", "group");
      ul.setAttribute("aria-labelledby", id);
      btn.addEventListener("click", () => toggle(btn, ul));
      li.appendChild(btn);
      li.appendChild(ul);
      return { li, ul, btn };
    }

    function buildYearFolders(parentUl, years, itemBuilder) {
      years.forEach(([year, items]) => {
        const y = makeFolder(String(year), false);
        items.forEach((r) => {
          const rLi = document.createElement("li");
          itemBuilder(rLi, r);
          y.ul.appendChild(rLi);
        });
        parentUl.appendChild(y.li);
      });
    }

    function buildVideoItem(li, r) {
      li.innerHTML = `<div class="file-line">${docIcon()}<a href="${r.youtube}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a></div>`;
    }

    function buildTree() {
      const root = document.getElementById("tree");

      // CJ Flemings → Music / Videos / Tour
      const cj = makeFolder("CJ Flemings", true);

      // MUSIC first, open on landing
      const music = makeFolder("Music", true);
      buildYearFolders(music.ul, groupByYear(RELEASES), (rLi, r) => buildRelease(rLi, r, false));
      cj.ul.appendChild(music.li);

      // VIDEOS closed
      const videos = makeFolder("Videos", false);
      buildYearFolders(videos.ul, groupByYear(VIDEOS), buildVideoItem);
      cj.ul.appendChild(videos.li);

      // TOUR — TBA
      const tour = makeFolder("Tour", false);
      const tbaLi = document.createElement("li");
      tbaLi.innerHTML = `<div class="file-line">${docIcon()}<span class="meta">Tour dates to be announced</span></div>`;
      tour.ul.appendChild(tbaLi);
      cj.ul.appendChild(tour.li);

      // Socials under CJ Flemings
      const socialLi = document.createElement("li");
      const iconLinks = SOCIAL_ICONS.map((s) => {
        const isMail = s.href.startsWith("mailto:");
        const extra = isMail ? "" : ` target="_blank" rel="noopener noreferrer"`;
        return `<a class="social-icon" href="${s.href}"${extra} aria-label="${s.label}">${s.svg}</a>`;
      }).join("");
      socialLi.innerHTML = `<div class="socials" aria-label="Links">
        <a class="about-link" href="about.html">About</a>
        ${iconLinks}
      </div>`;
      cj.ul.appendChild(socialLi);

      const outer = document.createElement("ul");
      outer.setAttribute("role", "tree");
      outer.appendChild(cj.li);
      root.appendChild(outer);
    }

    buildTree();
  </script>
</body>
</html>
